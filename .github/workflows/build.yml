name: Build LuK Driver Academy 3DS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Compiler l'application
        run: make

      - name: Publier le fichier 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: LuK-Driver-Academy-3DS
          path: "*.3dsx"
          
